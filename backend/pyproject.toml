[project]
name = "sunfleck"
version = "0.1.0.dev0"
description = "Self-hosted plant care for indoor and outdoor plants."
readme = "../README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1,<6.2",
    "django-ninja>=1.7",
    "dj-database-url>=3.1",
    "django-allauth[headless]>=65.21",
    "django-stubs-ext>=6.1",
    "gunicorn>=26.2",
    "whitenoise>=6.12",
    "pillow>=13.0",
    "pillow-heif>=1.8",
    "pyyaml>=6.0.3",
    "jsonschema>=4.26",
    "pluggy>=1.7.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.3"]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1",
    "factory-boy>=3.3",
    "mypy>=2.4",
    "pre-commit>=4.7",
    "pre-commit-hooks>=6.0",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pytest-django>=4.14",
    "time-machine>=3.6",
    "ruff>=0.17",
    "types-pyyaml>=6.0.12.20260906",
    "types-jsonschema>=4.26.0.20261006",
    "hypothesis>=6.170.12",
]

[tool.uv]
package = false

# --- Ruff: formatting and linting -------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "N",       # PEP 8 naming
    "UP",      # modern Python syntax
    "B",       # likely bugs
    "SIM",     # simplifications
    "C4",      # comprehensions
    "DJ",      # Django conventions
    "DTZ",     # timezone-naive datetimes
    "S",       # security
    "T20",     # print statements
    "PT",      # pytest style
    "RUF",     # Ruff-specific rules
]
ignore = [
    "RUF012",  # Django's class attributes (Meta.constraints, fieldsets, ...) are meant to be lists
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
    "S101",  # assert is how pytest works
    "S105",  # fake passwords in tests are fine
    "S106",
]
"**/migrations/**" = ["E501", "I001"]  # generated by Django

# --- mypy: type checking ----------------------------------------------------------------------

[tool.mypy]
strict = true
plugins = ["mypy_django_plugin.main"]
exclude = ["/migrations/"]

[[tool.mypy.overrides]]
module = ["allauth", "allauth.*"]  # no type information published
ignore_missing_imports = true

[[tool.mypy.overrides]]
# factory_boy's field helpers (Sequence, SubFactory, ...) have no type hints.
module = ["sunfleck.conftest", "sunfleck.*.tests.*"]
disallow_untyped_calls = false

[tool.django-stubs]
django_settings_module = "sunfleck.config.test_settings"

# --- pytest and coverage ----------------------------------------------------------------------

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "sunfleck.config.test_settings"
addopts = "--strict-markers --cov=sunfleck --cov-report=term-missing"
filterwarnings = ["error"]  # a warning today is a bug tomorrow; fix or explicitly ignore it
testpaths = ["sunfleck"]

[tool.coverage.run]
branch = true
omit = ["*/migrations/*", "*/tests/*", "sunfleck/config/wsgi.py"]

[tool.coverage.report]
fail_under = 85
skip_covered = true
