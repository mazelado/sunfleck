# Care profile ("archetype") for the Sunfleck care dataset. CC BY-SA 4.0: see ../LICENSE.
# Field reference: ../README.md. Months are for the northern hemisphere; the app mirrors
# them in the southern hemisphere.
key: air_plant
name:
  en: Air plant
description:
  en: 'Tillandsias that need no soil: soak or mist, then let them dry within a few hours.'
setting: indoor
examples:
- Tillandsia
watering:
  # From the sources' advice on how often to water; see docs/care-review-2026-11-part-2.md.
  interval_days:
    spring: 4
    summer: 3
    autumn: 4
    winter: 7
  let_dry: completely
# dli_min and dli_max: not sourced. dli_ideal: inside the bromeliads' range in P1.
light:
  dli_min: 5
  dli_ideal: 10
  dli_max: 20
humidity: medium
temperature_c:
  min: 12
  ideal_min: 15
  ideal_max: 27
  max: 30
fertilizing:
  interval_days: 30
  pause_months_north:
  - 11
  - 12
  - 1
  - 2
notes:
  en: 'Watering means soaking for 20–30 minutes, then drying upside down. Don''t water when it''s below 12 °C: they stay wet too long.'
status: reviewed
sources:
- 'Air plants. Royal Horticultural Society. https://www.rhs.org.uk/plants/types/houseplants/air-plants, accessed 2026-11-20'
- 'Tillandsia. NC State Extension Plant Toolbox. https://plants.ces.ncsu.edu/plants/tillandsia/, accessed 2026-11-20'
- 'Torres, A.P. and R.G. Lopez. Measuring Daily Light Integral in a Greenhouse (HO-238-W), Table 2. Purdue Extension. https://www.extension.purdue.edu/extmedia/ho/ho-238-w.pdf, accessed 2026-11-20'
