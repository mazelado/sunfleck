# Care profile ("archetype") for the Sunfleck care dataset. CC BY-SA 4.0: see ../LICENSE.
# Field reference: ../README.md. Months are for the northern hemisphere; the app mirrors
# them in the southern hemisphere.
key: tropical_pitcher_plant
name:
  en: Tropical pitcher plant
description:
  en: 'Nepenthes: warm, humid, bright indirect light, and moist but airy moss-based mix.'
setting: indoor
examples:
- Nepenthes
watering:
  # Starting estimates: the sources say how dry the soil should be, not how many days.
  interval_days:
    spring: 4
    summer: 3
    autumn: 5
    winter: 7
  let_dry: keep_moist
# Sources describe the light in words, not numbers: these values are estimates.
light:
  dli_min: 6
  dli_ideal: 10
  dli_max: 16
humidity: high
temperature_c:
  min: 15
  ideal_min: 21
  ideal_max: 29
  max: 32
fertilizing: null
notes:
  en: Use rain, distilled, or reverse-osmosis water.
status: reviewed
sources:
- 'Nepenthes. NC State Extension Plant Toolbox. https://plants.ces.ncsu.edu/plants/nepenthes/, accessed 2026-11-20'
- 'How to grow carnivorous plants. Royal Horticultural Society. https://www.rhs.org.uk/plants/types/carnivorous/growing-guide, accessed 2026-11-20'
