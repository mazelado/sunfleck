# Care profile ("archetype") for the Sunfleck care dataset. CC BY-SA 4.0: see ../LICENSE.
# Field reference: ../README.md. Months are for the northern hemisphere; the app mirrors
# them in the southern hemisphere.
key: spring_bulb
name:
  en: Spring bulb
description:
  en: 'Bulbs that flower in spring and rest underground in summer: water while in leaf, then
    let them dry off after the foliage yellows.'
setting: outdoor
examples:
- Tulipa
- Narcissus
- Hyacinthus
- Crocus
- Allium
watering:
  # Starting estimates: the sources say how dry the soil should be, not how many days.
  interval_days:
    spring: 7
    summer: null
    autumn: 21
    winter: null
  let_dry: top_third
# Sources describe the light in words, not numbers: these values are estimates.
light:
  dli_min: 15
  dli_ideal: 25
  dli_max: 40
  outdoor_exposure:
  - full_sun
  - part_shade
# humidity: not sourced.
humidity: medium
# ideal_min and max: not sourced.
temperature_c:
  min: -30
  ideal_min: 5
  ideal_max: 20
  max: 27
# interval_days: not sourced; feed from when the shoots appear until the leaves die down.
fertilizing:
  interval_days: 30
  pause_months_north:
  - 6
  - 7
  - 8
  - 9
  - 10
  - 11
  - 12
  - 1
dormancy_months_north:
- 6
- 7
- 8
status: reviewed
sources:
- 'Tulipa. NC State Extension Plant Toolbox. https://plants.ces.ncsu.edu/plants/tulipa/, accessed 2026-11-20'
- 'Narcissus. NC State Extension Plant Toolbox. https://plants.ces.ncsu.edu/plants/narcissus/, accessed 2026-11-20'
- 'How to grow tulips. Royal Horticultural Society. https://www.rhs.org.uk/plants/tulip/growing-guide, accessed 2026-11-20'
- 'How to grow daffodils. Royal Horticultural Society. https://www.rhs.org.uk/plants/daffodils/growing-guide, accessed 2026-11-20'
- 'How to grow bulbs. Royal Horticultural Society. https://www.rhs.org.uk/plants/types/bulbs/growing-guide, accessed 2026-11-20'
