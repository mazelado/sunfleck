# Care profile ("archetype") for the Sunfleck care dataset. CC BY-SA 4.0: see ../LICENSE.
# Field reference: ../README.md. Months are for the northern hemisphere; the app mirrors
# them in the southern hemisphere.
key: forest_cactus
name:
  en: Forest cactus
description:
  en: 'Cacti that grow on trees in rainforests: bright indirect light and more water than
    desert cacti; many flower after a cool, drier rest.'
setting: indoor
examples:
- Schlumbergera
- Epiphyllum
- Rhipsalis
watering:
  # From the sources' advice on how often to water; see docs/care-review-2026-11-part-2.md.
  interval_days:
    spring: 10
    summer: 7
    autumn: 10
    winter: 14
  let_dry: top_half
light:
  dli_min: 6
  dli_ideal: 12
  dli_max: 18
humidity: medium_high
temperature_c:
  min: 10
  ideal_min: 16
  ideal_max: 24
  max: 30
fertilizing:
  interval_days: 30
  pause_months_north:
  - 10
  - 11
  - 12
  - 1
status: reviewed
sources:
- 'Schlumbergera. NC State Extension Plant Toolbox. https://plants.ces.ncsu.edu/plants/schlumbergera/, accessed 2026-11-20'
- 'Holiday cacti. University of Minnesota Extension. https://extension.umn.edu/garden-and-home/yard-and-garden/gardening-in-minnesota/holiday-cacti, accessed 2026-11-20'
- 'How to grow Christmas cactus. Royal Horticultural Society. https://www.rhs.org.uk/plants/christmas-cactus/growing-guide, accessed 2026-11-20'
- 'How to grow epiphyllum cacti. Royal Horticultural Society. https://www.rhs.org.uk/plants/epiphyllum/growing-guide, accessed 2026-11-20'
- 'Torres, A.P. and R.G. Lopez. Measuring Daily Light Integral in a Greenhouse (HO-238-W), Table 2. Purdue Extension. https://www.extension.purdue.edu/extmedia/ho/ho-238-w.pdf, accessed 2026-11-20'
