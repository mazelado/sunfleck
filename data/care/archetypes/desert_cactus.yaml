# Care profile ("archetype") for the Sunfleck care dataset. CC BY-SA 4.0: see ../LICENSE.
# Field reference: ../README.md. Months are for the northern hemisphere; the app mirrors
# them in the southern hemisphere.
key: desert_cactus
name:
  en: Desert cactus
description:
  en: 'Cacti from deserts and dry grasslands: as much sun as possible, water thoroughly but
    rarely, and keep almost dry in winter.'
setting: either
examples:
- Mammillaria
- Opuntia
- Echinopsis
- Gymnocalycium
watering:
  # Starting estimates: the sources say how dry the soil should be, not how many days.
  interval_days:
    spring: 21
    summer: 14
    autumn: 28
    winter: 45
  let_dry: completely
# Sources describe the light in words, not numbers: these values are estimates.
light:
  dli_min: 15
  dli_ideal: 25
  dli_max: 45
  outdoor_exposure:
  - full_sun
humidity: low
# max: not sourced.
temperature_c:
  min: 5
  ideal_min: 18
  ideal_max: 30
  max: 38
fertilizing:
  interval_days: 60
  pause_months_north:
  - 10
  - 11
  - 12
  - 1
  - 2
  - 3
dormancy_months_north:
- 11
- 12
- 1
- 2
status: reviewed
sources:
- 'Mammillaria. NC State Extension Plant Toolbox. https://plants.ces.ncsu.edu/plants/mammillaria/, accessed 2026-11-20'
- 'Cacti and succulents. University of Minnesota Extension. https://extension.umn.edu/garden-and-home/yard-and-garden/gardening-in-minnesota/cacti-and-succulents, accessed 2026-11-20'
- 'How to grow cacti and succulents. Royal Horticultural Society. https://www.rhs.org.uk/plants/types/cacti-succulents/houseplants/growing-guide, accessed 2026-11-20'
