# Care profile ("archetype") for the Sunfleck care dataset. CC BY-SA 4.0: see ../LICENSE.
# Field reference: ../README.md. Months are for the northern hemisphere; the app mirrors
# them in the southern hemisphere.
key: fruiting_vegetable
name:
  en: Fruiting vegetable
description:
  en: 'Warm-season crops grown for their fruit: full sun, steady watering (uneven watering
    causes split or rotten fruit), and regular feeding once flowering.'
setting: outdoor
examples:
- Solanum
- Capsicum
- Cucumis
- Cucurbita
- Phaseolus
- Fragaria
watering:
  # Starting estimates: the sources say how dry the soil should be, not how many days.
  interval_days:
    spring: 3
    summer: 2
    autumn: 3
    winter: 7
  let_dry: top_quarter
# dli_max: not sourced (P1 stops at 30).
light:
  dli_min: 14
  dli_ideal: 30
  dli_max: 50
  outdoor_exposure:
  - full_sun
# humidity: not sourced.
humidity: medium
# min: not sourced.
temperature_c:
  min: 10
  ideal_min: 18
  ideal_max: 29
  max: 35
fertilizing:
  interval_days: 14
  pause_months_north: []
status: reviewed
sources:
- 'How to grow tomatoes. Royal Horticultural Society. https://www.rhs.org.uk/vegetables/tomatoes/grow-your-own, accessed 2026-11-20'
- 'How to grow sweet peppers. Royal Horticultural Society. https://www.rhs.org.uk/vegetables/peppers/grow-your-own, accessed 2026-11-20'
- 'Watering the vegetable garden. University of Minnesota Extension. https://extension.umn.edu/garden-and-home/yard-and-garden/gardening-in-minnesota/watering-the-vegetable-garden, accessed 2026-11-20'
- 'How excessive heat affects the vegetable garden. University of Minnesota Extension. https://extension.umn.edu/garden-and-home/yard-and-garden/gardening-in-minnesota/yard-and-garden-problems/how-excessive-heat-affects-the-vegetable-garden, accessed 2026-11-20'
- 'Torres, A.P. and R.G. Lopez. Measuring Daily Light Integral in a Greenhouse (HO-238-W), Table 2. Purdue Extension. https://www.extension.purdue.edu/extmedia/ho/ho-238-w.pdf, accessed 2026-11-20'
