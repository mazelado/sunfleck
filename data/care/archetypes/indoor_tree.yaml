# Care profile ("archetype") for the Sunfleck care dataset. CC BY-SA 4.0: see ../LICENSE.
# Field reference: ../README.md. Months are for the northern hemisphere; the app mirrors
# them in the southern hemisphere.
key: indoor_tree
name:
  en: Indoor tree
description:
  en: 'Tree-like houseplants: bright light (some direct sun is welcome), water when the top
    third is dry, and avoid moving them often.'
setting: indoor
examples:
- Ficus
- Schefflera
- Pachira
- Strelitzia
- Persea
watering:
  # Starting estimates: the sources say how dry the soil should be, not how many days.
  interval_days:
    spring: 9
    summer: 7
    autumn: 10
    winter: 14
  let_dry: top_third
light:
  dli_min: 10
  dli_ideal: 16
  dli_max: 25
humidity: medium_high
temperature_c:
  min: 12
  ideal_min: 18
  ideal_max: 27
  max: 32
fertilizing:
  interval_days: 30
  pause_months_north:
  - 11
  - 12
  - 1
  - 2
status: reviewed
sources:
- 'Torres, A.P. and R.G. Lopez. Measuring Daily Light Integral in a Greenhouse (HO-238-W), Table 2. Purdue Extension. https://www.extension.purdue.edu/extmedia/ho/ho-238-w.pdf, accessed 2026-11-15'
- 'Chen, J., D.B. McConnell, R.J. Henny and K.C. Everitt. Cultural Guidelines for Commercial Production of Interiorscape Ficus (ENH879/EP136). UF/IFAS Extension. https://ask.ifas.ufl.edu/publication/EP136, accessed 2026-11-15'
- 'How to grow avocados. Royal Horticultural Society. https://www.rhs.org.uk/plants/avocado/growing-guide, accessed 2026-11-15'
- 'Persea americana. NC State Extension Plant Toolbox. https://plants.ces.ncsu.edu/plants/persea-americana/, accessed 2026-11-15'
