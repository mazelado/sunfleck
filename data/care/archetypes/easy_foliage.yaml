# Care profile ("archetype") for the Sunfleck care dataset. CC BY-SA 4.0: see ../LICENSE.
# Field reference: ../README.md. Months are for the northern hemisphere; the app mirrors
# them in the southern hemisphere.
key: easy_foliage
name:
  en: Easy foliage
description:
  en: 'Fast-growing, adaptable houseplants: water when the top third is dry; they show thirst
    by drooping and recover quickly.'
setting: indoor
examples:
- Chlorophytum
- Tradescantia
- Pilea
- Hedera
watering:
  # Starting estimates: the sources say how dry the soil should be, not how many days.
  interval_days:
    spring: 8
    summer: 6
    autumn: 9
    winter: 12
  let_dry: top_third
light:
  dli_min: 6
  dli_ideal: 9
  dli_max: 18
humidity: medium
temperature_c:
  min: 10
  ideal_min: 16
  ideal_max: 26
  max: 30
fertilizing:
  interval_days: 60
  pause_months_north:
  - 10
  - 11
  - 12
  - 1
  - 2
  - 3
status: reviewed
sources:
- 'Chlorophytum comosum. NC State Extension Plant Toolbox. https://plants.ces.ncsu.edu/plants/chlorophytum-comosum/, accessed 2026-11-20'
- 'Tradescantia zebrina. NC State Extension Plant Toolbox. https://plants.ces.ncsu.edu/plants/tradescantia-zebrina/, accessed 2026-11-20'
- 'How to grow spider plants. Royal Horticultural Society. https://www.rhs.org.uk/plants/spider-plants/growing-guide, accessed 2026-11-20'
- 'How to grow pilea. Royal Horticultural Society. https://www.rhs.org.uk/plants/pilea/how-to-grow-pilea, accessed 2026-11-20'
- 'How to grow ivy indoors. Royal Horticultural Society. https://www.rhs.org.uk/plants/ivy/ivy-as-a-houseplant, accessed 2026-11-20'
- 'Torres, A.P. and R.G. Lopez. Measuring Daily Light Integral in a Greenhouse (HO-238-W), Table 2. Purdue Extension. https://www.extension.purdue.edu/extmedia/ho/ho-238-w.pdf, accessed 2026-11-20'
