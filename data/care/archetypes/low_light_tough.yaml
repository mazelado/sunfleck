# Care profile ("archetype") for the Sunfleck care dataset. CC BY-SA 4.0: see ../LICENSE.
# Field reference: ../README.md. Months are for the northern hemisphere; the app mirrors
# them in the southern hemisphere.
key: low_light_tough
name:
  en: Tough low-light foliage
description:
  en: 'Very forgiving plants that store water: tolerate low light and long dry spells; overwatering
    is the main risk.'
setting: indoor
examples:
- Zamioculcas
- Sansevieria
- Aspidistra
watering:
  # From the sources' advice on how often to water; see docs/care-review-2026-11-part-2.md.
  interval_days:
    spring: 21
    summer: 14
    autumn: 21
    winter: 30
  let_dry: completely
# Sources describe the light in words, not numbers: these values are estimates.
light:
  dli_min: 2
  dli_ideal: 6
  dli_max: 15
humidity: low
# max: not sourced.
temperature_c:
  min: 10
  ideal_min: 15
  ideal_max: 24
  max: 32
fertilizing:
  interval_days: 60
  pause_months_north:
  - 10
  - 11
  - 12
  - 1
  - 2
notes:
  en: 'Cast iron plants (Aspidistra) like a little more water than ZZ and snake plants: water them before the soil dries out completely.'
status: reviewed
sources:
- 'Zamioculcas zamiifolia. NC State Extension Plant Toolbox. https://plants.ces.ncsu.edu/plants/zamioculcas-zamiifolia/, accessed 2026-11-20'
- 'Dracaena trifasciata. NC State Extension Plant Toolbox. https://plants.ces.ncsu.edu/plants/dracaena-trifasciata/, accessed 2026-11-20'
- 'Aspidistra elatior. NC State Extension Plant Toolbox. https://plants.ces.ncsu.edu/plants/aspidistra-elatior/, accessed 2026-11-20'
- 'How to grow sansevierias. Royal Horticultural Society. https://www.rhs.org.uk/plants/sansevieria/growing-guide, accessed 2026-11-20'
- 'How to grow aspidistras. Royal Horticultural Society. https://www.rhs.org.uk/plants/aspidistra/how-to-grow-aspidistras, accessed 2026-11-20'
