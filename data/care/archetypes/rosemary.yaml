# Care profile ("archetype") for the Sunfleck care dataset. CC BY-SA 4.0: see ../LICENSE.
# Field reference: ../README.md. Months are for the northern hemisphere; the app mirrors
# them in the southern hemisphere.
key: rosemary
name:
  en: Rosemary
description:
  en: 'A sun-loving shrub that hates wet roots, but in a pot shouldn''t dry out completely:
    full sun, and a cool, bright spot indoors over winter.'
setting: either
examples:
- Salvia rosmarinus
watering:
  # Starting estimates: the sources say how dry the soil should be, not how many days.
  interval_days:
    spring: 7
    summer: 5
    autumn: 9
    winter: 14
  let_dry: top_half
light:
  dli_min: 12
  dli_ideal: 22
  dli_max: 40
  outdoor_exposure:
  - full_sun
humidity: medium
temperature_c:
  min: -10
  ideal_min: 15
  ideal_max: 24
  max: 35
fertilizing:
  interval_days: 30
  pause_months_north:
  - 11
  - 12
  - 1
  - 2
notes:
  en: 'Indoors in winter, dry air and a dried-out pot brown its tips, but extra water rots the roots: keep it cool and bright, and water when the top half is dry.'
status: reviewed
sources:
- 'How to grow rosemary. Royal Horticultural Society. https://www.rhs.org.uk/herbs/rosemary/grow-your-own, accessed 2026-11-15'
- 'Rosemary. Illinois Extension. https://extension.illinois.edu/herbs/rosemary, accessed 2026-11-15'
- 'Herbs all winter: grow them indoors (2021). Illinois Extension. https://extension.illinois.edu/blogs/flowers-fruits-and-frass/2021-01-08-herbs-all-winter-grow-them-indoors, accessed 2026-11-15'
- 'Salvia rosmarinus. NC State Extension Plant Toolbox. https://plants.ces.ncsu.edu/plants/salvia-rosmarinus/, accessed 2026-11-15'
- 'Torres, A.P. and R.G. Lopez. Measuring Daily Light Integral in a Greenhouse (HO-238-W), Table 2. Purdue Extension. https://www.extension.purdue.edu/extmedia/ho/ho-238-w.pdf, accessed 2026-11-15'
