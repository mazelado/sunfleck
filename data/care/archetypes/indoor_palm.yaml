# Care profile ("archetype") for the Sunfleck care dataset. CC BY-SA 4.0: see ../LICENSE.
# Field reference: ../README.md. Months are for the northern hemisphere; the app mirrors
# them in the southern hemisphere.
key: indoor_palm
name:
  en: Indoor palm
description:
  en: 'Shade-tolerant palms: evenly moist but never soggy soil, bright indirect light.'
setting: indoor
examples:
- Chamaedorea
- Howea
- Dypsis
- Rhapis
watering:
  # Starting estimates: the sources say how dry the soil should be, not how many days.
  interval_days:
    spring: 8
    summer: 6
    autumn: 9
    winter: 12
  let_dry: top_quarter
# Sources describe the light in words, not numbers: these values are estimates.
light:
  dli_min: 4
  dli_ideal: 8
  dli_max: 15
humidity: medium
temperature_c:
  min: 12
  ideal_min: 18
  ideal_max: 27
  max: 32
fertilizing:
  interval_days: 30
  pause_months_north:
  - 11
  - 12
  - 1
  - 2
status: reviewed
sources:
- 'Chamaedorea elegans. NC State Extension Plant Toolbox. https://plants.ces.ncsu.edu/plants/chamaedorea-elegans/, accessed 2026-11-20'
- 'Howea forsteriana. NC State Extension Plant Toolbox. https://plants.ces.ncsu.edu/plants/howea-forsteriana/, accessed 2026-11-20'
- 'Rhapis excelsa. NC State Extension Plant Toolbox. https://plants.ces.ncsu.edu/plants/rhapis-excelsa/, accessed 2026-11-20'
- 'Palms indoors. Royal Horticultural Society. https://www.rhs.org.uk/plants/types/trees/indoor-palms, accessed 2026-11-20'
- 'How to grow chamaedorea. Royal Horticultural Society. https://www.rhs.org.uk/plants/chamaedorea/growing-guide, accessed 2026-11-20'
