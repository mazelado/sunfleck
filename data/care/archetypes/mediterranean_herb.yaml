# Care profile ("archetype") for the Sunfleck care dataset. CC BY-SA 4.0: see ../LICENSE.
# Field reference: ../README.md. Months are for the northern hemisphere; the app mirrors
# them in the southern hemisphere.
key: mediterranean_herb
name:
  en: Mediterranean herbs and shrubs
description:
  en: 'Sun-loving, drought-tolerant herbs and shrubs: full sun, free-draining soil, water
    only when mostly dry.'
setting: either
examples:
- Salvia
- Thymus
- Lavandula
- Origanum
- Laurus
- Olea
watering:
  # Starting estimates: the sources say how dry the soil should be, not how many days.
  interval_days:
    spring: 7
    summer: 5
    autumn: 9
    winter: 14
  let_dry: mostly
light:
  dli_min: 12
  dli_ideal: 22
  dli_max: 40
  outdoor_exposure:
  - full_sun
humidity: low
temperature_c:
  min: -10
  ideal_min: 15
  ideal_max: 28
  max: 35
fertilizing:
  interval_days: 60
  pause_months_north:
  - 10
  - 11
  - 12
  - 1
  - 2
  - 3
status: reviewed
sources:
- 'Torres, A.P. and R.G. Lopez. Measuring Daily Light Integral in a Greenhouse (HO-238-W), Table 2. Purdue Extension. https://www.extension.purdue.edu/extmedia/ho/ho-238-w.pdf, accessed 2026-11-15'
- 'How to grow lavender. Royal Horticultural Society. https://www.rhs.org.uk/plants/lavender/growing-guide, accessed 2026-11-15'
- 'Lavandula angustifolia. NC State Extension Plant Toolbox. https://plants.ces.ncsu.edu/plants/lavandula-angustifolia/, accessed 2026-11-15'
