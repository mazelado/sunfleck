key: bog_carnivore
name:
  en: Bog carnivore
description:
  en: 'Carnivorous plants from sunny bogs: always wet with rain or distilled water, full sun,
    a cold winter rest, and no fertilizer.'
setting: either
examples:
- Dionaea
- Sarracenia
- Drosera
watering:
  interval_days:
    spring: 2
    summer: 1
    autumn: 2
    winter: 7
  let_dry: keep_moist
light:
  dli_min: 15
  dli_ideal: 25
  dli_max: 40
  outdoor_exposure:
  - full_sun
humidity: high
temperature_c:
  min: -5
  ideal_min: 18
  ideal_max: 32
  max: 38
fertilizing: null
dormancy_months_north:
- 11
- 12
- 1
- 2
notes:
  en: Use rain, distilled, or reverse-osmosis water; tap water minerals harm them.
status: draft
sources:
- 'Sunfleck contributors'' general horticultural knowledge (2026). Starting estimates: please
  add a citable source when you refine them.'
