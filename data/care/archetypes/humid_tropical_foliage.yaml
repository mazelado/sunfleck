# Care profile ("archetype") for the Sunfleck care dataset. CC BY-SA 4.0: see ../LICENSE.
# Field reference: ../README.md. Months are for the northern hemisphere; the app mirrors
# them in the southern hemisphere.
key: humid_tropical_foliage
name:
  en: Humid tropical foliage
description:
  en: 'Fussy rainforest-floor plants: evenly moist soil, high humidity, no direct sun.'
setting: indoor
examples:
- Calathea
- Maranta
- Alocasia
- Fittonia
watering:
  # Starting estimates: the sources say how dry the soil should be, not how many days.
  interval_days:
    spring: 5
    summer: 4
    autumn: 6
    winter: 8
  let_dry: top_quarter
light:
  dli_min: 4
  dli_ideal: 7
  dli_max: 10
humidity: high
# max: not sourced.
temperature_c:
  min: 16
  ideal_min: 18
  ideal_max: 26
  max: 30
fertilizing:
  interval_days: 30
  pause_months_north:
  - 10
  - 11
  - 12
  - 1
  - 2
  - 3
status: reviewed
sources:
- 'Maranta leuconeura. NC State Extension Plant Toolbox. https://plants.ces.ncsu.edu/plants/maranta-leuconeura/, accessed 2026-11-20'
- 'How to grow calatheas. Royal Horticultural Society. https://www.rhs.org.uk/plants/calathea/growing-guide, accessed 2026-11-20'
- 'How to grow alocasias. Royal Horticultural Society. https://www.rhs.org.uk/plants/alocasia/growing-guide, accessed 2026-11-20'
- 'How to grow fittonia. Royal Horticultural Society. https://www.rhs.org.uk/plants/fittonia/how-to-grow-fittonia, accessed 2026-11-20'
- 'Torres, A.P. and R.G. Lopez. Measuring Daily Light Integral in a Greenhouse (HO-238-W), Table 2. Purdue Extension. https://www.extension.purdue.edu/extmedia/ho/ho-238-w.pdf, accessed 2026-11-20'
