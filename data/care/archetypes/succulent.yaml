# Care profile ("archetype") for the Sunfleck care dataset. CC BY-SA 4.0: see ../LICENSE.
# Field reference: ../README.md. Months are for the northern hemisphere; the app mirrors
# them in the southern hemisphere.
key: succulent
name:
  en: Succulent
description:
  en: 'Water-storing plants from dry places: lots of light, gritty soil, and water only when
    the soil has dried out completely.'
setting: either
examples:
- Echeveria
- Crassula
- Aloe
- Haworthiopsis
- Sedum
watering:
  # Starting estimates: the sources say how dry the soil should be, not how many days.
  interval_days:
    spring: 14
    summer: 10
    autumn: 18
    winter: 28
  let_dry: completely
light:
  dli_min: 10
  dli_ideal: 18
  dli_max: 35
  outdoor_exposure:
  - full_sun
  - part_shade
humidity: low
temperature_c:
  min: 5
  ideal_min: 15
  ideal_max: 27
  max: 35
fertilizing:
  interval_days: 60
  pause_months_north:
  - 10
  - 11
  - 12
  - 1
  - 2
status: reviewed
sources:
- 'Cacti and succulents. University of Minnesota Extension. https://extension.umn.edu/garden-and-home/yard-and-garden/gardening-in-minnesota/cacti-and-succulents, accessed 2026-11-15'
- 'Aloe vera. NC State Extension Plant Toolbox. https://plants.ces.ncsu.edu/plants/aloe-vera/, accessed 2026-11-15'
- 'Aloe, a Hardy Houseplant. Penn State Extension. https://extension.psu.edu/aloe-a-hardy-houseplant, accessed 2026-11-15'
- 'Aloe vera (plant details). Royal Horticultural Society. https://www.rhs.org.uk/plants/981/aloe-vera/details, accessed 2026-11-15'
- 'Houseplants for sunlight (RHS Urban Show 2024). Royal Horticultural Society. https://www.rhs.org.uk/shows-events/rhs-urban-show/houseplant-profiles/houseplants-for-sunlight, accessed 2026-11-15'
- 'Kalanchoe blossfeldiana. NC State Extension Plant Toolbox. https://plants.ces.ncsu.edu/plants/kalanchoe-blossfeldiana/, accessed 2026-11-15'
- 'A nontraditional holiday plant: Kalanchoe (2025). Illinois Extension. https://extension.illinois.edu/blogs/good-growing/2025-12-19-nontraditional-holiday-plant-kalanchoe, accessed 2026-11-15'
- 'Torres, A.P. and R.G. Lopez. Measuring Daily Light Integral in a Greenhouse (HO-238-W), Table 2. Purdue Extension. https://www.extension.purdue.edu/extmedia/ho/ho-238-w.pdf, accessed 2026-11-15'
