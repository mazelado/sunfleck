# Care profile ("archetype") for the Sunfleck care dataset. CC BY-SA 4.0: see ../LICENSE.
# Field reference: ../README.md. Months are for the northern hemisphere; the app mirrors
# them in the southern hemisphere.
key: shade_perennial
name:
  en: Shade perennial
description:
  en: 'Perennials for shady gardens: moist, rich soil and protection from midday sun.'
setting: outdoor
examples:
- Hosta
- Heuchera
- Astilbe
- Helleborus
- Dryopteris
watering:
  # Starting estimates: the sources say how dry the soil should be, not how many days.
  interval_days:
    spring: 5
    summer: 3
    autumn: 7
    winter: null
  let_dry: top_quarter
light:
  dli_min: 6
  dli_ideal: 10
  dli_max: 20
  outdoor_exposure:
  - part_shade
  - shade
humidity: medium
# min: on the safe side; hosta and heuchera are hardy to −40 °C. ideal_min, ideal_max and max: not sourced.
temperature_c:
  min: -25
  ideal_min: 10
  ideal_max: 24
  max: 30
fertilizing: null
dormancy_months_north:
- 12
- 1
- 2
notes:
  en: Most need no feeding in a border; in poor soil, give a balanced fertilizer in spring.
status: reviewed
sources:
- 'Hosta. NC State Extension Plant Toolbox. https://plants.ces.ncsu.edu/plants/hosta/, accessed 2026-11-20'
- 'Heuchera. NC State Extension Plant Toolbox. https://plants.ces.ncsu.edu/plants/heuchera/, accessed 2026-11-20'
- 'Hostas. University of Minnesota Extension. https://extension.umn.edu/garden-and-home/yard-and-garden/gardening-in-minnesota/growing-hostas-in-minnesota, accessed 2026-11-20'
- 'How to grow hostas. Royal Horticultural Society. https://www.rhs.org.uk/plants/hosta/growing-guide, accessed 2026-11-20'
- 'How to grow heuchera. Royal Horticultural Society. https://www.rhs.org.uk/plants/heuchera/growing-guide, accessed 2026-11-20'
- 'How to grow hellebores. Royal Horticultural Society. https://www.rhs.org.uk/plants/hellebore/growing-guide, accessed 2026-11-20'
- 'How to grow astilbe. Royal Horticultural Society. https://www.rhs.org.uk/plants/astilbe/growing-guide, accessed 2026-11-20'
- 'How to grow perennial plants. Royal Horticultural Society. https://www.rhs.org.uk/plants/types/perennials/growing-guide, accessed 2026-11-20'
- 'Torres, A.P. and R.G. Lopez. Measuring Daily Light Integral in a Greenhouse (HO-238-W), Table 2. Purdue Extension. https://www.extension.purdue.edu/extmedia/ho/ho-238-w.pdf, accessed 2026-11-20'
