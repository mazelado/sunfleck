# Care profile ("archetype") for the Sunfleck care dataset. CC BY-SA 4.0: see ../LICENSE.
# Field reference: ../README.md. Months are for the northern hemisphere; the app mirrors
# them in the southern hemisphere.
key: bromeliad
name:
  en: Bromeliad
description:
  en: 'Tank bromeliads: keep a little water in the central cup, water the soil sparingly,
    and give bright indirect light.'
setting: indoor
examples:
- Guzmania
- Vriesea
- Aechmea
- Neoregelia
watering:
  # Starting estimates: the sources say how dry the soil should be, not how many days.
  interval_days:
    spring: 10
    summer: 7
    autumn: 10
    winter: 14
  let_dry: top_half
light:
  dli_min: 6
  dli_ideal: 9
  dli_max: 14
humidity: medium_high
temperature_c:
  min: 10
  ideal_min: 18
  ideal_max: 27
  max: 32
fertilizing:
  interval_days: 60
  pause_months_north:
  - 11
  - 12
  - 1
  - 2
notes:
  en: 'Keep water in the central cup, and empty and refill it every month or two. Never put fertilizer in the cup.'
status: reviewed
sources:
- 'Park Brown, S. Bromeliads at a Glance (ENH1071/EP337). UF/IFAS Extension. https://ask.ifas.ufl.edu/publication/EP337, accessed 2026-11-15'
- 'How to grow bromeliads. Royal Horticultural Society. https://www.rhs.org.uk/plants/bromeliads/growing-guide, accessed 2026-11-15'
- 'Torres, A.P. and R.G. Lopez. Measuring Daily Light Integral in a Greenhouse (HO-238-W), Table 2. Purdue Extension. https://www.extension.purdue.edu/extmedia/ho/ho-238-w.pdf, accessed 2026-11-15'
