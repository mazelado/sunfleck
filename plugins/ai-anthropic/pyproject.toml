[project]
name = "sunfleck-ai-anthropic"
version = "0.1.0"
description = "AI for Sunfleck through Anthropic's Claude API."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
# Runs inside Sunfleck, which provides Django, Pydantic and the plugin API.
dependencies = ["anthropic>=2.2,<3"]

[project.entry-points."sunfleck.plugins"]
ai_anthropic = "sunfleck_ai_anthropic:plugin"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sunfleck_ai_anthropic"]

[tool.ruff]
extend = "../../backend/pyproject.toml"

[tool.ruff.lint]
extend-per-file-ignores = { "**/tests/**" = ["S101"] }
