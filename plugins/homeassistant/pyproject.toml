[project]
name = "sunfleck-homeassistant"
version = "0.1.0"
description = "Sensors for Sunfleck from Home Assistant: soil moisture, light, temperature and humidity."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
# Runs inside Sunfleck, which provides Django, Pydantic and the plugin API.
dependencies = []

[project.entry-points."sunfleck.plugins"]
homeassistant = "sunfleck_homeassistant:plugin"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sunfleck_homeassistant"]

[tool.ruff]
extend = "../../backend/pyproject.toml"

[tool.ruff.lint]
# Fake access tokens in tests are fine.
extend-per-file-ignores = { "**/tests/**" = ["S101", "S105", "S106"] }
