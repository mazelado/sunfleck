[project]
name = "sunfleck-weather-openmeteo"
version = "0.1.0"
description = "Weather for Sunfleck from Open-Meteo: conditions on the Today page, frost alerts, and outdoor watering put off after rain."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
# Runs inside Sunfleck, which provides Django, Pydantic and the plugin API.
dependencies = []

[project.entry-points."sunfleck.plugins"]
weather_openmeteo = "sunfleck_weather_openmeteo:plugin"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sunfleck_weather_openmeteo"]

[tool.ruff]
extend = "../../backend/pyproject.toml"

[tool.ruff.lint]
extend-per-file-ignores = { "**/tests/**" = ["S101"], "**/migrations/**" = ["E501", "I001"] }
