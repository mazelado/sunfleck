# Docker Compose setup for running Sunfleck (see docs/install.md).
#   1. In this folder, copy env.example to .env and fill in the values.
#   2. Run: docker compose up -d
# Sunfleck is then available at http://localhost:8000. For access from other devices, put it
# behind a reverse proxy with HTTPS (Caddy, Traefik, Nginx Proxy Manager, ...).
#
# It uses the latest release. To stay on a version, set SUNFLECK_VERSION in .env (e.g. 0.1).
# To build the image from the source code instead, see compose.build.yaml.
services:
  sunfleck:
    image: ghcr.io/mazelado/sunfleck:${SUNFLECK_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # A named volume, managed by Docker, holds the database and uploaded photos.
      # To use a folder instead (e.g. ./data), create it first and give it to user ID 1000,
      # which the app runs as:  mkdir data && sudo chown 1000 data
      - sunfleck-data:/data
    env_file: .env
    environment:
      # Checked here too, so that a missing key stops `docker compose up` with this message,
      # not with a container that's only reported as "unhealthy".
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env, to a long random string (openssl rand -base64 48)}

  # Background jobs (reminders, weather, nightly recalculation), from the same image and data.
  worker:
    image: ghcr.io/mazelado/sunfleck:${SUNFLECK_VERSION:-latest}
    command: worker
    restart: unless-stopped
    depends_on:
      sunfleck:
        condition: service_healthy  # it runs the database migrations first
    volumes:
      - sunfleck-data:/data
    env_file: .env

volumes:
  sunfleck-data:
