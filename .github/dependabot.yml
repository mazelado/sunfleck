# Opens pull requests to keep dependencies up to date (see docs/STYLE_GUIDE.md, section 10).
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]
    ignore:
      # TypeScript 7 (a new, native compiler) isn't supported by typescript-eslint yet, so
      # the group can't install with it. Upgrade on its own once it is (see #116).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
