name: Docker

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and smoke-test the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate the Compose file
        working-directory: docker
        run: |
          cp env.example .env
          # The example's empty SECRET_KEY must stop Compose, with a message that says what to do.
          if docker compose config --quiet 2> "$RUNNER_TEMP/compose-error.txt"; then
            echo "Compose accepted an empty SECRET_KEY" >&2
            exit 1
          fi
          grep -q "Set SECRET_KEY in .env" "$RUNNER_TEMP/compose-error.txt"
          export SECRET_KEY=ci-only
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.build.yaml config --quiet
      - name: Build
        run: docker build --file docker/Dockerfile --tag sunfleck:ci .
      - name: Start a container
        run: docker run --detach --name sunfleck --publish 8000:8000 --env SECRET_KEY=ci-only sunfleck:ci
      - name: Wait until Docker reports it healthy
        run: |
          for _ in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' sunfleck)
            echo "Health: $status"
            [ "$status" = healthy ] && exit 0
            sleep 5
          done
          docker logs sunfleck
          exit 1
      - name: Check the API and the frontend respond
        run: |
          curl --fail --silent http://localhost:8000/api/v1/health
          curl --fail --silent http://localhost:8000/ | grep --quiet '<div id="root">'
          curl --fail --silent http://localhost:8000/plants/1 | grep --quiet '<div id="root">'
      - name: Show logs
        if: always()
        run: docker logs sunfleck || true
