name: Docker

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and smoke-test the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate the Compose file
        working-directory: docker
        run: |
          cp env.example .env
          # The example's empty SECRET_KEY must stop Compose, with a message that says what to do.
          if docker compose config --quiet 2> "$RUNNER_TEMP/compose-error.txt"; then
            echo "Compose accepted an empty SECRET_KEY" >&2
            exit 1
          fi
          grep -q "Set SECRET_KEY in .env" "$RUNNER_TEMP/compose-error.txt"
          export SECRET_KEY=ci-only
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.build.yaml config --quiet
      - name: Build
        run: docker build --file docker/Dockerfile --tag sunfleck:ci .
      # With the same limits as compose.yaml: no capabilities, and no way to gain any.
      - name: Start a container
        run: >-
          docker run --detach --name sunfleck --publish 8000:8000 --env SECRET_KEY=ci-only
          --cap-drop ALL --security-opt no-new-privileges:true sunfleck:ci
      - name: Wait until Docker reports it healthy
        run: |
          for _ in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' sunfleck)
            echo "Health: $status"
            [ "$status" = healthy ] && exit 0
            sleep 5
          done
          docker logs sunfleck
          exit 1
      - name: Check the API and the frontend respond
        run: |
          curl --fail --silent http://localhost:8000/api/v1/health
          curl --fail --silent http://localhost:8000/ | grep --quiet '<div id="root">'
          curl --fail --silent http://localhost:8000/plants/1 | grep --quiet '<div id="root">'
      # Its health check differs from the web server's: it has to have finished a job recently.
      - name: Check the worker reports healthy, and unhealthy once it stops finishing jobs
        run: |
          docker run --detach --name worker --volumes-from sunfleck --env SECRET_KEY=ci-only \
            --cap-drop ALL --security-opt no-new-privileges:true sunfleck:ci worker
          for _ in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' worker)
            echo "Health: $status"
            [ "$status" = healthy ] && break
            sleep 5
          done
          [ "$status" = healthy ] || { docker logs worker; exit 1; }
          docker exec worker touch -d '-45 minutes' /tmp/sunfleck-worker-heartbeat
          if docker exec worker python -m sunfleck.core.healthcheck; then
            echo "A worker that hasn't finished a job for 45 minutes was reported healthy" >&2
            exit 1
          fi
          docker logs worker
          docker rm --force worker  # the next steps replace its job queue
      - name: Check the job queue left by older images is removed
        run: |
          docker run --rm --volumes-from sunfleck --user root --entrypoint chown sunfleck:ci \
            root /data/huey.sqlite3
          docker run --rm --volumes-from sunfleck sunfleck:ci true 2> "$RUNNER_TEMP/start-log.txt"
          cat "$RUNNER_TEMP/start-log.txt"
          grep -q "Removed /data/huey.sqlite3" "$RUNNER_TEMP/start-log.txt"
      - name: Check a data file owned by root stops it with the fix
        run: |
          docker run --rm --volumes-from sunfleck --user root --entrypoint sh sunfleck:ci -c \
            'touch /data/owned-by-root && mkdir -m 700 /data/closed && chown 1000 /data/closed'
          if docker run --rm --volumes-from sunfleck sunfleck:ci true 2> "$RUNNER_TEMP/start-error.txt"; then
            echo "Started with a data file it can't write to" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/start-error.txt"
          grep -q "/data/owned-by-root isn't writable" "$RUNNER_TEMP/start-error.txt"
          grep -q "chown sunfleck -R 1000:" "$RUNNER_TEMP/start-error.txt"
      - name: Check the suggested fix works with the limits in compose.yaml
        run: |
          docker run --rm --volumes-from sunfleck --cap-drop ALL --security-opt no-new-privileges:true \
            --user root --cap-add CHOWN --cap-add DAC_READ_SEARCH --entrypoint chown sunfleck:ci \
            -R 1000:999 /data
          docker run --rm --volumes-from sunfleck sunfleck:ci true
      - name: Show logs
        if: always()
        run: docker logs sunfleck || true
