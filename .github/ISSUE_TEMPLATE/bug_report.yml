name: Bug report
description: Something isn't working as expected
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please search existing issues first to avoid duplicates.
        **Security vulnerabilities:** don't report them here. See CONTRIBUTING.md.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Tap on ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run the app?
      options:
        - Docker / Docker Compose
        - Manual install
        - Other
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database
      options:
        - SQLite (default)
        - PostgreSQL
        - Other
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. Android 15, Chrome 130 / iPhone, Safari / Desktop Firefox
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Relevant log output or screenshots. Remove any personal data and API keys first.
      render: text
